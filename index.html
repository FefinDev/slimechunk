<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Slime Chunks | Minecraft Style</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'VT323', monospace;
      background-color: #121212;
      background-image: 
        radial-gradient(#1e261e 15%, transparent 16%),
        radial-gradient(#181818 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: #2c2c2c;
      border: 4px solid #000;
      box-shadow: 
        inset -4px -4px 0px 0px #1a1a1a,
        inset 4px 4px 0px 0px #4a4a4a,
        8px 8px 20px rgba(0,0,0,0.8);
      padding: 25px;
      text-align: center;
      max-width: 850px;
      width: 100%;
      animation: fadeIn 0.5s ease-in-out;
    }

    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.4rem;
      color: #55ff55;
      text-shadow: 3px 3px 0px #000, 0 0 10px rgba(85, 255, 85, 0.4);
      margin-top: 0;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    /* PESTAÑAS / TABS */
    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: -4px;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .tab-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.75rem;
      background: #3c3c3c;
      color: #aaa;
      border: 3px solid #000;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: inset 3px 3px 0px #5a5a5a, inset -3px -3px 0px #1e1e1e;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background: #4a4a4a;
      color: #fff;
    }

    .tab-btn.active {
      background: #55ff55;
      color: #000;
      text-shadow: none;
      box-shadow: inset 3px 3px 0px #88ff88, inset -3px -3px 0px #22aa22;
      transform: translateY(-2px);
    }

    /* CONTENEDOR PESTAÑAS */
    .tab-content {
      background-color: #1e1e1e;
      border: 3px solid #000;
      box-shadow: inset 3px 3px 0px #101010, inset -3px -3px 0px #333333;
      padding: 20px;
      margin-bottom: 20px;
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .controls-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: flex-end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    label {
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: #ffff55;
      text-shadow: 1px 1px 0px #000;
    }

    input, select {
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      background-color: #000;
      border: 2px solid #555;
      color: #fff;
      padding: 6px 10px;
      outline: none;
      box-shadow: inset 2px 2px 0px #222;
    }

    input[type="number"] { width: 110px; }
    input#seed { width: 160px; }
    input[type="file"] { font-size: 1rem; width: 220px; }

    input:focus, select:focus {
      border-color: #55ff55;
    }

    /* BOTONES */
    .mc-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      background-color: #707070;
      color: #fff;
      border: 3px solid #000;
      padding: 10px 16px;
      cursor: pointer;
      text-shadow: 2px 2px 0px #000;
      box-shadow: inset 3px 3px 0px #9e9e9e, inset -3px -3px 0px #3a3a3a;
      transition: transform 0.1s, filter 0.2s;
    }

    .mc-btn:hover {
      filter: brightness(1.2);
    }

    .mc-btn:active {
      transform: scale(0.96);
      box-shadow: inset -2px -2px 0px #9e9e9e, inset 2px 2px 0px #3a3a3a;
    }

    .mc-btn.green {
      background-color: #2e8b2e;
      box-shadow: inset 3px 3px 0px #55ff55, inset -3px -3px 0px #1e5e1e;
    }

    .mc-btn.blue {
      background-color: #2b5b88;
      box-shadow: inset 3px 3px 0px #55ffff, inset -3px -3px 0px #1a3956;
    }

    /* BARRA DE PROGRESO */
    .progress-bar {
      width: 100%;
      background-color: #000;
      border: 2px solid #555;
      margin-bottom: 15px;
      display: none;
      height: 24px;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background-color: #55ff55;
      width: 0%;
      transition: width 0.15s ease-out;
      box-shadow: inset 0 2px 0 #88ff88, inset 0 -2px 0 #22aa22;
    }

    .progress-text {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.6rem;
      color: #fff;
      text-shadow: 1px 1px 0 #000;
    }

    /* MAPA */
    .map-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 15px;
    }

    canvas {
      background-color: #050505;
      border: 4px solid #000;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(0, 0, 0, 0.8);
      image-rendering: pixelated;
      cursor: grab;
      max-width: 100%;
      height: auto;
      touch-action: none;
      transition: border-color 0.3s;
    }

    canvas:hover {
      border-color: #55ff55;
    }

    canvas:active { cursor: grabbing; }

    .hint {
      font-size: 1.1rem;
      color: #aaa;
      margin-bottom: 10px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 1.1rem;
    }

    .color-box {
      display: inline-block;
      width: 14px; height: 14px;
      vertical-align: middle;
      margin-right: 6px;
      border: 2px solid #000;
    }

    .color-box.slime { background-color: #55ff55; box-shadow: 0 0 6px #55ff55; }
    .color-box.normal { background-color: #222222; }
    .color-box.center { background-color: transparent; border: 2px solid #ff3333; }

    /* ANIMACIONES */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SLIME CHUNK FINDER 🟩</h1>
    
    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('seed-tab')">🌱 CON SEMILLA</button>
      <button class="tab-btn" onclick="switchTab('file-tab')">📁 DESDE ARCHIVO</button>
    </div>

    <div id="seed-tab" class="tab-content active">
      <div class="controls-grid">
        <div class="input-group">
          <label for="edition">Edición:</label>
          <select id="edition">
            <option value="java">Java Edition</option>
            <option value="bedrock">Bedrock Edition</option>
          </select>
        </div>

        <div class="input-group">
          <label for="seed">Semilla (Seed):</label>
          <input type="text" id="seed" placeholder="Ej: 12345" value="12345">
        </div>
        
        <div class="input-group">
          <label for="block-x">Bloque X:</label>
          <input type="number" id="block-x" value="0">
        </div>

        <div class="input-group">
          <label for="block-z">Bloque Z:</label>
          <input type="number" id="block-z" value="0">
        </div>

        <button id="render-direct-btn" class="mc-btn green">VER MAPA</button>
      </div>

      <div class="controls-grid" style="margin-top: 15px; border-top: 2px dashed #444; padding-top: 15px;">
        <div class="input-group">
          <label for="radius">Radio Descarga (Bloques):</label>
          <input type="number" id="radius" value="6000" step="100">
        </div>
        <button id="download-btn" class="mc-btn blue">DESCARGAR CSV</button>
      </div>
    </div>

    <div id="file-tab" class="tab-content">
      <div class="controls-grid">
        <div class="input-group">
          <label for="csv-file">Seleccionar CSV:</label>
          <input type="file" id="csv-file" accept=".csv">
        </div>

        <div class="input-group">
          <label for="file-block-x">Bloque X:</label>
          <input type="number" id="file-block-x" value="0">
        </div>

        <div class="input-group">
          <label for="file-block-z">Bloque Z:</label>
          <input type="number" id="file-block-z" value="0">
        </div>

        <button id="load-file-btn" class="mc-btn green">CARGAR Y VER</button>
      </div>
    </div>

    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
      <div class="progress-text" id="progress-text">0%</div>
    </div>

    <div class="hint">🖱️ Mantén pulsado y arrastra el mapa para desplazarte</div>

    <div class="map-wrapper">
      <canvas id="slime-map" width="640" height="640"></canvas>
    </div>

    <div class="legend">
      <span><span class="color-box slime"></span> Slime Chunk</span>
      <span><span class="color-box normal"></span> Chunk Normal</span>
      <span><span class="color-box center"></span> Tu Posición</span>
    </div>
  </div>

  <script>
    // --- CAMBIO DE PESTAÑAS ---
    let activeMode = 'direct'; // 'direct' o 'file'

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabId === 'seed-tab') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('seed-tab').classList.add('active');
        activeMode = 'direct';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('file-tab').classList.add('active');
        activeMode = 'file';
      }
      drawMap();
    }

    // --- WORKER EN SEGUNDO PLANO ---
    const workerCode = `
      class JavaRandom {
        constructor(seed) { this.setSeed(seed); }
        setSeed(seed) {
          const multiplier = BigInt("0x5DEECE66D");
          const mask = (BigInt(1) << BigInt(48)) - BigInt(1);
          this.seed = (BigInt(seed) ^ multiplier) & mask;
        }
        next(bits) {
          const multiplier = BigInt("0x5DEECE66D");
          const addend = BigInt("0xB");
          const mask = (BigInt(1) << BigInt(48)) - BigInt(1);
          this.seed = (this.seed * multiplier + addend) & mask;
          return Number(this.seed >> BigInt(48 - bits));
        }
        nextInt(bound) {
          if ((bound & -bound) === bound) return Number((BigInt(bound) * BigInt(this.next(31))) >> BigInt(31));
          let bits, val;
          do { bits = this.next(31); val = bits % bound; } while (bits - val + (bound - 1) < 0);
          return val;
        }
      }

      class BedrockRandom {
        constructor(seed) { this.seed = seed >>> 0; }
        nextInt(bound) {
          this.seed = (Math.imul(this.seed, 0x41c64e6d) + 0x3039) >>> 0;
          return (this.seed >>> 16) % bound;
        }
      }

      function parseSeed(seedInput) {
        if (!isNaN(seedInput) && seedInput.trim() !== '') return BigInt(seedInput.trim());
        let hash = 0;
        for (let i = 0; i < seedInput.length; i++) {
          hash = (hash << 5) - hash + seedInput.charCodeAt(i);
          hash |= 0;
        }
        return BigInt(hash);
      }

      function isSlimeChunkJava(seed, chunkX, chunkZ) {
        const x = BigInt(chunkX);
        const z = BigInt(chunkZ);
        const slimeSeed = (
          seed +
          (x * x * BigInt("0x4c1906")) +
          (x * BigInt("0x5ac0db")) +
          (z * z * BigInt("0x4307a7")) +
          (z * BigInt("0x5f24f"))
        ) ^ BigInt("0x3ad8025f");
        return (new JavaRandom(slimeSeed)).nextInt(10) === 0;
      }

      function isSlimeChunkBedrock(chunkX, chunkZ) {
        let x = chunkX >>> 0, z = chunkZ >>> 0;
        let seed = (Math.imul(x, 0x1f1f1f1f) ^ z) >>> 0;
        return (new BedrockRandom(seed)).nextInt(10) === 0;
      }

      self.onmessage = function(e) {
        const { seedInput, radiusBlocks, edition } = e.data;
        const seed = parseSeed(seedInput);
        const radiusChunks = Math.floor(radiusBlocks / 16);
        const radiusSq = radiusChunks * radiusChunks;

        let csvLines = ["ChunkX,ChunkZ"];
        const totalRows = radiusChunks * 2 + 1;
        let processedRows = 0;

        for (let x = -radiusChunks; x <= radiusChunks; x++) {
          for (let z = -radiusChunks; z <= radiusChunks; z++) {
            if (x * x + z * z <= radiusSq) {
              let isSlime = (edition === 'java') 
                ? isSlimeChunkJava(seed, x, z) 
                : isSlimeChunkBedrock(x, z);

              if (isSlime) csvLines.push(\`\${x},\${z}\`);
            }
          }
          processedRows++;
          if (processedRows % 10 === 0 || processedRows === totalRows) {
            self.postMessage({ type: 'progress', progress: Math.round((processedRows / totalRows) * 100) });
          }
        }

        self.postMessage({ type: 'done', csvContent: csvLines.join('\\n') });
      };
    `;

    // --- CÓDIGO VISOR Y CANVAS ---
    const canvas = document.getElementById('slime-map');
    const ctx = canvas.getContext('2d');
    let loadedSlimeSet = new Set();

    let currentBlockX = 0;
    let currentBlockZ = 0;

    class JavaRandom {
      constructor(seed) { this.setSeed(seed); }
      setSeed(seed) {
        const multiplier = BigInt("0x5DEECE66D");
        const mask = (BigInt(1) << BigInt(48)) - BigInt(1);
        this.seed = (BigInt(seed) ^ multiplier) & mask;
      }
      next(bits) {
        const multiplier = BigInt("0x5DEECE66D");
        const addend = BigInt("0xB");
        const mask = (BigInt(1) << BigInt(48)) - BigInt(1);
        this.seed = (this.seed * multiplier + addend) & mask;
        return Number(this.seed >> BigInt(48 - bits));
      }
      nextInt(bound) {
        if ((bound & -bound) === bound) return Number((BigInt(bound) * BigInt(this.next(31))) >> BigInt(31));
        let bits, val;
        do { bits = this.next(31); val = bits % bound; } while (bits - val + (bound - 1) < 0);
        return val;
      }
    }

    class BedrockRandom {
      constructor(seed) { this.seed = seed >>> 0; }
      nextInt(bound) {
        this.seed = (Math.imul(this.seed, 0x41c64e6d) + 0x3039) >>> 0;
        return (this.seed >>> 16) % bound;
      }
    }

    function parseSeed(seedInput) {
      if (!isNaN(seedInput) && seedInput.trim() !== '') return BigInt(seedInput.trim());
      let hash = 0;
      for (let i = 0; i < seedInput.length; i++) {
        hash = (hash << 5) - hash + seedInput.charCodeAt(i);
        hash |= 0;
      }
      return BigInt(hash);
    }

    function isSlimeChunkJava(seed, chunkX, chunkZ) {
      const x = BigInt(chunkX);
      const z = BigInt(chunkZ);
      const slimeSeed = (
        seed +
        (x * x * BigInt("0x4c1906")) +
        (x * BigInt("0x5ac0db")) +
        (z * z * BigInt("0x4307a7")) +
        (z * BigInt("0x5f24f"))
      ) ^ BigInt("0x3ad8025f");
      return (new JavaRandom(slimeSeed)).nextInt(10) === 0;
    }

    function isSlimeChunkBedrock(chunkX, chunkZ) {
      let x = chunkX >>> 0, z = chunkZ >>> 0;
      let seed = (Math.imul(x, 0x1f1f1f1f) ^ z) >>> 0;
      return (new BedrockRandom(seed)).nextInt(10) === 0;
    }

    function drawMap() {
      const edition = document.getElementById('edition').value;
      const seedInput = document.getElementById('seed').value;
      const worldSeed = parseSeed(seedInput);

      const centerChunkX = Math.floor(currentBlockX / 16);
      const centerChunkZ = Math.floor(currentBlockZ / 16);

      const gridSize = 32;
      const chunkSizeInPixels = canvas.width / gridSize;

      const startChunkX = centerChunkX - Math.floor(gridSize / 2);
      const startChunkZ = centerChunkZ - Math.floor(gridSize / 2);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let x = 0; x < gridSize; x++) {
        for (let z = 0; z < gridSize; z++) {
          const currentChunkX = startChunkX + x;
          const currentChunkZ = startChunkZ + z;

          let isSlime = false;
          if (activeMode === 'direct') {
            isSlime = (edition === 'java') 
              ? isSlimeChunkJava(worldSeed, currentChunkX, currentChunkZ)
              : isSlimeChunkBedrock(currentChunkX, currentChunkZ);
          } else {
            isSlime = loadedSlimeSet.has(`${currentChunkX},${currentChunkZ}`);
          }

          ctx.fillStyle = isSlime ? '#55ff55' : '#1a1a1a';
          ctx.fillRect(
            x * chunkSizeInPixels,
            z * chunkSizeInPixels,
            chunkSizeInPixels,
            chunkSizeInPixels
          );

          ctx.strokeStyle = '#2b2b2b';
          ctx.lineWidth = 1;
          ctx.strokeRect(
            x * chunkSizeInPixels,
            z * chunkSizeInPixels,
            chunkSizeInPixels,
            chunkSizeInPixels
          );
        }
      }

      // Marcar centro
      ctx.strokeStyle = '#ff3333';
      ctx.lineWidth = 2;
      const centerPixel = Math.floor(gridSize / 2) * chunkSizeInPixels;
      ctx.strokeRect(centerPixel, centerPixel, chunkSizeInPixels, chunkSizeInPixels);
    }

    // --- CONTROLES DE ARRASTRE (DRAGGABLE) ---
    let isDragging = false;
    let startX = 0, startY = 0;

    function handleStart(e) {
      isDragging = true;
      startX = e.clientX || e.touches[0].clientX;
      startY = e.clientY || e.touches[0].clientY;
    }

    function handleMove(e) {
      if (!isDragging) return;
      const currentX = e.clientX || e.touches[0].clientX;
      const currentY = e.clientY || e.touches[0].clientY;

      const deltaX = currentX - startX;
      const deltaY = currentY - startY;

      if (Math.abs(deltaX) >= 20 || Math.abs(deltaY) >= 20) {
        const chunkShiftX = Math.trunc(deltaX / 20);
        const chunkShiftZ = Math.trunc(deltaY / 20);

        currentBlockX -= chunkShiftX * 16;
        currentBlockZ -= chunkShiftZ * 16;

        document.getElementById('block-x').value = currentBlockX;
        document.getElementById('block-z').value = currentBlockZ;
        document.getElementById('file-block-x').value = currentBlockX;
        document.getElementById('file-block-z').value = currentBlockZ;

        startX = currentX;
        startY = currentY;

        drawMap();
      }
    }

    function handleEnd() { isDragging = false; }

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart);
    window.addEventListener('touchmove', handleMove);
    window.addEventListener('touchend', handleEnd);

    // --- EVENTOS DE BOTONES ---
    document.getElementById('render-direct-btn').addEventListener('click', () => {
      activeMode = 'direct';
      currentBlockX = parseInt(document.getElementById('block-x').value) || 0;
      currentBlockZ = parseInt(document.getElementById('block-z').value) || 0;
      drawMap();
    });

    document.getElementById('load-file-btn').addEventListener('click', () => {
      const fileInput = document.getElementById('csv-file');
      if (!fileInput.files[0]) {
        alert("¡Por favor selecciona un archivo .csv!");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const lines = e.target.result.trim().split('\n');

        loadedSlimeSet.clear();
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (line) loadedSlimeSet.add(line);
        }

        activeMode = 'file';
        currentBlockX = parseInt(document.getElementById('file-block-x').value) || 0;
        currentBlockZ = parseInt(document.getElementById('file-block-z').value) || 0;
        drawMap();
      };
      reader.readAsText(fileInput.files[0]);
    });

    // Descarga Worker
    const blob = new Blob([workerCode], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(blob);

    document.getElementById('download-btn').addEventListener('click', () => {
      const seedInput = document.getElementById('seed').value;
      const radiusBlocks = parseInt(document.getElementById('radius').value) || 6000;
      const edition = document.getElementById('edition').value;

      const progressBar = document.getElementById('progress-bar');
      const progressFill = document.getElementById('progress-fill');
      const progressText = document.getElementById('progress-text');

      progressBar.style.display = 'block';

      const worker = new Worker(workerUrl);
      worker.postMessage({ seedInput, radiusBlocks, edition });

      worker.onmessage = function(e) {
        if (e.data.type === 'progress') {
          progressFill.style.width = e.data.progress + '%';
          progressText.innerText = 'GENERANDO... ' + e.data.progress + '%';
        } else if (e.data.type === 'done') {
          progressBar.style.display = 'none';

          const csvBlob = new Blob([e.data.csvContent], { type: 'text/csv' });
          const url = URL.createObjectURL(csvBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `slime_chunks_r${radiusBlocks}.csv`;
          a.click();
          URL.revokeObjectURL(url);
          worker.terminate();
        }
      };
    });

    window.addEventListener('load', () => {
      currentBlockX = parseInt(document.getElementById('block-x').value) || 0;
      currentBlockZ = parseInt(document.getElementById('block-z').value) || 0;
      drawMap();
    });
  </script>
</body>
</html>
